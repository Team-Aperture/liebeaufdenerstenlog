<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges" width="512" height="512">
  <rect width="16" height="16" fill="#2b1630"/>
  <!-- pixel heart -->
  <g fill="#ff5d9e">
    <rect x="3" y="3" width="3" height="2"/>
    <rect x="10" y="3" width="3" height="2"/>
    <rect x="2" y="5" width="12" height="3"/>
    <rect x="3" y="8" width="10" height="2"/>
    <rect x="4" y="10" width="8" height="1"/>
    <rect x="6" y="11" width="4" height="1"/>
    <rect x="7" y="12" width="2" height="1"/>
  </g>
  <!-- compass needle -->
  <g fill="#ffc857">
    <rect x="7" y="5" width="2" height="1"/>
    <rect x="7" y="6" width="2" height="3"/>
  </g>
  <rect x="7" y="6" width="2" height="1" fill="#fff6ea"/>
</svg>
